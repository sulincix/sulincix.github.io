<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC P2P Manual Signaling</title>
    <style>
        body {
            font-family: sans-serif;
            background: #121212;
            color: #e0e0e0;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .box {
            background: #1e1e1e;
            border: 1px solid #333;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 6px;
        }
        .flex-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }
        textarea {
            width: 100%;
            height: 80px;
            box-sizing: border-box;
            background: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            padding: 8px;
            resize: none;
            margin-top: 5px;
        }
        .chat-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .chat-group input {
            flex: 1;
            background: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            padding: 8px;
            border-radius: 4px;
        }
        .chat-log {
            height: 200px;
            overflow-y: auto;
            background: #151515;
            border: 1px solid #333;
            padding: 10px;
            margin-top: 10px;
            border-radius: 4px;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 4px;
        }
        button:disabled {
            background: #444;
            cursor: not-allowed;
        }
        .status { color: #ff4d4d; font-weight: bold; }
        .status.connected { color: #2ecc71; }
        .msg-system { color: #aaa; font-style: italic; }
        .msg-me { color: #3498db; }
        .msg-peer { color: #e67e22; }
        .role-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <h2>WebRTC Manual Signaling</h2>
    
    <div id="setupArea">
        <div class="role-buttons">
            <button id="startOfferBtn">Oda Kur (Create Offer)</button>
            <button id="startAnswerBtn" style="background:#27ae60;">Katıl (Join / Answer)</button>
        </div>

        <div class="box" id="localBox" style="display:none;">
            <div class="flex-header">
                <strong id="localTitle">Local Session Data (Base64)</strong>
                <button id="copyBtn">Copy</button>
            </div>
            <textarea id="localSession" readonly placeholder="Generating SDP with ICE candidates... Please wait."></textarea>
        </div>

        <div class="box" id="remoteBox" style="display:none;">
            <strong id="remoteTitle">Remote Session Data (Base64)</strong>
            <textarea id="remoteSession" placeholder="Paste remote token here..."></textarea>
            <div style="text-align: right; margin-top: 10px;">
                <button id="setRemote">Connect / Process Token</button>
            </div>
        </div>
    </div>

    <div id="messageArea" style="display:none" class="box">
        <h3>P2P Data Channel</h3>
        <p>Status: <span id="status" class="status">Disconnected</span></p>
        
        <div class="chat-log" id="chatlog">
            <div class="msg-system">System: Waiting for connection...</div>
        </div>

        <div class="chat-group">
            <input type="text" id="messageInput" placeholder="Type a message..." disabled>
            <button id="sendMessage" disabled>Send</button>
        </div>
    </div>

    <script>
        const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com' }] });
        let dataChannel;

        const setupArea = document.getElementById('setupArea');
        const messageArea = document.getElementById('messageArea');
        const localSession = document.getElementById('localSession');
        const remoteSession = document.getElementById('remoteSession');
        const statusText = document.getElementById('status');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendMessage');
        const chatlog = document.getElementById('chatlog');
        const copyBtn = document.getElementById('copyBtn');
        
        const startOfferBtn = document.getElementById('startOfferBtn');
        const startAnswerBtn = document.getElementById('startAnswerBtn');
        const localBox = document.getElementById('localBox');
        const remoteBox = document.getElementById('remoteBox');

        const logMessage = (sender, msg) => {
            const cls = sender === "You" ? "msg-me" : (sender === "System" ? "msg-system" : "msg-peer");
            chatlog.innerHTML += `<div><strong class="${cls}">${sender}:</strong> ${msg}</div>`;
            chatlog.scrollTop = chatlog.scrollHeight;
        };

        const sendMsg = () => {
            if (dataChannel?.readyState === "open" && messageInput.value.trim()) {
                dataChannel.send(messageInput.value);
                logMessage("You", messageInput.value);
                messageInput.value = "";
            }
        };

        function setupChannel(channel) {
            dataChannel = channel;
            channel.onopen = () => {
                statusText.innerText = "Connected";
                statusText.classList.add("connected");
                messageInput.disabled = sendBtn.disabled = false;
                setupArea.style.display = "none";
                messageArea.style.display = "block";
                logMessage("System", "Connected successfully!");
            };
            channel.onclose = () => {
                statusText.innerText = "Disconnected";
                statusText.classList.remove("connected");
                messageInput.disabled = sendBtn.disabled = true;
                setupArea.style.display = "block";
                messageArea.style.display = "none";
                logMessage("System", "Disconnected.");
            };
            channel.onmessage = e => logMessage("Peer", e.data);
        }

        // Rol 1: Oda Sahibi (Offer Oluşturucu)
        startOfferBtn.onclick = async () => {
            startOfferBtn.disabled = startAnswerBtn.disabled = true;
            localBox.style.display = "block";
            remoteBox.style.display = "block";
            document.getElementById('remoteTitle').innerText = "Paste ANSWER Token Here";

            setupChannel(pc.createDataChannel("chatChannel"));
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
        };

        // Rol 2: Katılımcı (Answer Oluşturucu)
        startAnswerBtn.onclick = () => {
            startOfferBtn.disabled = startAnswerBtn.disabled = true;
            remoteBox.style.display = "block";
            document.getElementById('remoteTitle').innerText = "Paste OFFER Token First";
        };

        // ICE Toplama işlemi bittiğinde (null geldiğinde) token üretilir
        pc.onicecandidate = (event) => {
            if (event.candidate === null) {
                const jsonStr = JSON.stringify(pc.localDescription);
                localSession.value = btoa(unescape(encodeURIComponent(jsonStr)));
                logMessage("System", "Token generation complete. Copy and send to your peer.");
            }
        };

        pc.ondatachannel = e => setupChannel(e.channel);

        document.getElementById('setRemote').onclick = async () => {
            const token = remoteSession.value.trim();
            if (!token) return;
            try {
                const decodedStr = decodeURIComponent(escape(atob(token))).trim();
                const remoteDesc = JSON.parse(decodedStr);
                
                await pc.setRemoteDescription(remoteDesc);
                
                if (remoteDesc.type === "offer") {
                    // Katılımcı teklifi aldıktan sonra kendi yerel cevabını (Answer) üretir
                    localBox.style.display = "block";
                    document.getElementById('localTitle').innerText = "Your ANSWER Token (Send this back)";
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                }
            } catch (err) {
                alert("Invalid configuration data! Make sure you copied the entire token.");
                console.error(err);
            }
        };

        copyBtn.onclick = () => {
            if(!localSession.value) return;
            navigator.clipboard.writeText(localSession.value);
            copyBtn.innerText = "Copied!";
            setTimeout(() => copyBtn.innerText = "Copy", 1500);
        };

        sendBtn.onclick = sendMsg;
        messageInput.onkeydown = e => { if (e.key === "Enter") sendMsg(); };
    </script>
</body>
</html>
