<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC P2P Manual Signaling</title>
    <style>
        body {
            font-family: sans-serif;
            background: #121212;
            color: #e0e0e0;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .box {
            background: #1e1e1e;
            border: 1px solid #333;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 6px;
        }
        .flex-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }
        .badge {
            background: #28a745;
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }
        textarea {
            width: 100%;
            height: 90px;
            box-sizing: border-box;
            background: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            padding: 8px;
            resize: none;
            margin-top: 5px;
            font-family: monospace;
            font-size: 11px;
            word-break: break-all;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }
        button:hover { background: #0056b3; }

        .chat-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .chat-group input {
            flex: 1;
            background: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            padding: 10px;
            border-radius: 4px;
        }
        .chat-log {
            height: 250px;
            border: 1px solid #333;
            background: #151515;
            padding: 10px;
            overflow-y: auto;
            border-radius: 4px;
            font-family: monospace;
        }
        .status { color: #dc3545; font-weight: bold; }
        .status.connected { color: #28a745; }
        .msg-me { color: #007bff; }
        .msg-peer { color: #28a745; }
        .msg-system { color: #aaa; font-style: italic; }
    </style>
</head>
<body>

    <h2>WebRTC Manual Signaling</h2>

    <div id="setupArea">
        <div class="box">
            <div class="flex-header">
                <div>
                    <strong>1. Your Code </strong>
                    <span id="codeStatus" class="badge">Ready</span>
                </div>
                <button id="copyBtn">Copy</button>
            </div>
            <textarea id="localSession" readonly placeholder="Generating code..."></textarea>
        </div>

        <div class="box">
            <strong>2. Paste the other side's code (connects automatically)</strong>
            <textarea id="remoteSession" placeholder="Paste the code from the other side here. It will respond automatically..."></textarea>
        </div>
    </div>

    <div id="messageArea" style="display:none" class="box">
        <h3>P2P Data Channel</h3>
        <p>Status: <span id="status" class="status">Disconnected</span></p>

        <div class="chat-log" id="chatlog" style="margin-bottom:15px;">
            <div class="msg-system">System: Waiting for connection...</div>
        </div>

        <div class="chat-group">
            <input type="text" id="messageInput" placeholder="Type a message..." disabled>
            <button id="sendMessage" disabled>Send</button>
        </div>
    </div>

    <script>
        let pc;
        let dataChannel;
        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com' }] };

        const setupArea = document.getElementById('setupArea');
        const messageArea = document.getElementById('messageArea');
        const localSession = document.getElementById('localSession');
        const remoteSession = document.getElementById('remoteSession');
        const statusText = document.getElementById('status');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendMessage');
        const chatlog = document.getElementById('chatlog');
        const copyBtn = document.getElementById('copyBtn');
        const codeStatus = document.getElementById('codeStatus');

        const logMessage = (sender, msg) => {
            const cls = sender === "You" ? "msg-me" : (sender === "System" ? "msg-system" : "msg-peer");
            chatlog.innerHTML += `<div><strong class="${cls}">${sender}:</strong> ${msg}</div>`;
            chatlog.scrollTop = chatlog.scrollHeight;
        };

        const sendMsg = () => {
            if (dataChannel?.readyState === "open" && messageInput.value.trim()) {
                dataChannel.send(messageInput.value);
                logMessage("You", messageInput.value);
                messageInput.value = "";
            }
        };

        function setupChannel(channel) {
            dataChannel = channel;
            channel.onopen = () => {
                statusText.innerText = "Connected";
                statusText.classList.add("connected");
                messageInput.disabled = sendBtn.disabled = false;
                setupArea.style.display = "none";
                messageArea.style.display = "block";
                logMessage("System", "Connected!");
            };
            channel.onclose = () => {
                statusText.innerText = "Disconnected";
                statusText.classList.remove("connected");
                messageInput.disabled = sendBtn.disabled = true;
                setupArea.style.display = "block";
                messageArea.style.display = "none";
                logMessage("System", "Connection lost.");
            };
            channel.onmessage = e => logMessage("Peer", e.data);
        }

        function updateLocalSession() {
            if (pc.localDescription) {
                localSession.value = btoa(unescape(encodeURIComponent(JSON.stringify(pc.localDescription))));
            }
        }

        async function initAsOfferCreator() {
            pc = new RTCPeerConnection(rtcConfig);
            setupChannel(pc.createDataChannel("chatChannel"));
            pc.ondatachannel = e => setupChannel(e.channel);
            pc.onicecandidate = updateLocalSession;

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            updateLocalSession();
        }

        initAsOfferCreator();

        async function handleAutomaticSignaling() {
            const token = remoteSession.value.trim();
            if (!token) return;

            try {
                const remoteDesc = JSON.parse(decodeURIComponent(escape(atob(token))).trim());

                if (remoteDesc.type === "offer") {
                    pc.close();
                    codeStatus.innerText = "Answer Ready";

                    pc = new RTCPeerConnection(rtcConfig);
                    pc.ondatachannel = e => setupChannel(e.channel);
                    pc.onicecandidate = updateLocalSession;

                    await pc.setRemoteDescription(remoteDesc);
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    updateLocalSession();
                } else if (remoteDesc.type === "answer") {
                    await pc.setRemoteDescription(remoteDesc);
                }
            } catch {
                // Incomplete paste — wait silently
            }
        }

        remoteSession.oninput = handleAutomaticSignaling;

        copyBtn.onclick = () => {
            if (!localSession.value) return;
            navigator.clipboard.writeText(localSession.value);
            copyBtn.innerText = "Copied!";
            setTimeout(() => copyBtn.innerText = "Copy", 1500);
        };

        sendBtn.onclick = sendMsg;
        messageInput.onkeydown = e => { if (e.key === "Enter") sendMsg(); };
    </script>
</body>
</html>
